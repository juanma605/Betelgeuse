# =============================================================================
# inmobot — configuración
# Todo lo que cambia entre búsquedas (o entre clientes) vive acá.
# =============================================================================

search:
  # Zonas a rastrear. Se usan como texto de búsqueda y para agrupar comparables.
  # Podés poner barrios, partidos o ciudades.
  zones:
    - "Palermo"
    - "Belgrano"
    - "Belgrano R"
    - "Recoleta"
    - "Almagro"
    - "Caballito"
    - "Cañitas"
    - "Villa Urquiza"
    - "Colegiales"
    - "Villa Crespo"
  # Moneda en la que querés comparar. Los avisos en otra moneda se convierten
  # usando fx_rates (abajo) o se descartan si no hay cotización.
  currency: USD

  price_min: 10000
  price_max: 600000

  # Recuadro geográfico de la búsqueda. Un aviso con coordenadas afuera se
  # descarta: no es un aviso raro, es la señal de que el portal entendió
  # otra cosa. Remax, ante un slug de zona que no reconoce, no devuelve 404
  # sino otra búsqueda — buscando "Cañitas" entraron 148 avisos de Allen,
  # San Jerónimo y Mar del Plata. Los avisos sin coordenadas pasan igual.
  # Estos valores son CABA; para buscar en otro lado, cambialos.
  bbox:
    lat_min: -34.71
    lat_max: -34.52
    lon_min: -58.54
    lon_max: -58.33

  # Piso de precio por m² (en la moneda de comparación). Por debajo de esto
  # no hay oferta seria: son errores de carga o avisos que no son una venta.
  # Vistos en la base: "Compramos propiedades en CABA" a 20 USD/m² (una
  # inmobiliaria que compra, no que vende), "Propiedad ficticia no
  # consultar" a 75, y emprendimientos que publican el anticipo en vez del
  # precio de la unidad, a 142 y 179.
  #
  # Es un piso grosero a propósito: la mediana de CABA ronda los 2.700, así
  # que 200 descarta disparates sin rozar ninguna oportunidad real. Si un
  # aviso no publica superficie no se filtra, porque no hay con qué
  # dividir. Dejalo en null para no aplicarlo.
  min_price_per_m2: 200

  # Superficie máxima creíble para lo que buscás. Por encima es un error de
  # carga del portal (hubo un 1½ ambiente con "33420 m²"): se borra ese dato,
  # pero el aviso se guarda igual. No es un filtro: el aviso no se descarta.
  max_plausible_area_m2: 1000

  # Filtros sobre atributos del aviso. Dejá en null lo que no quieras filtrar.
  filters:
    covered_area_min: 10        # m² cubiertos
    covered_area_max: null
    total_area_min: null
    rooms_min: null            # ambientes
    rooms_max: null 
    bedrooms_min: null
    max_maintenance_fee: null   # expensas, en moneda local
    max_age_years: null         # antigüedad
    require_photos: true

  # Cotizaciones para normalizar a `currency`. Actualizalas a mano o
  # enchufá una API después (ver README).
  fx_rates:
    ARS_per_USD: 1500

sources:
  mercadolibre:
    # Se lee el sitio público, no la API: la API cerró la búsqueda a apps no
    # certificadas y la certificación no es alcanzable para este proyecto.
    # Arma la URL como
    #   /<property_slug>/<operation_slug>/<listing_slug>/<region_slug>/<zona>/
    enabled: true
    property_slug: departamentos          # departamentos | casas | ph
    operation_slug: venta                 # venta | alquiler
    # Sin este filtro la primera página son casi todos emprendimientos (ML
    # los ordena arriba). Dejalo vacío ("") para no filtrar.
    listing_slug: propiedades-individuales
    region_slug: capital-federal
    # El robots.txt prohíbe paginar (_Desde_): una página (~48 avisos) por
    # zona. Una sola request por zona, espaciadas.
    rate_limit_seconds: 8.0

  zonaprop:
    enabled: true
    # Arman la URL como <property_slug>-<operation_slug>-<zona>.html
    # Podés poner un solo tipo o una lista (ej. [departamentos, casas, ph])
    # — la fuente recorre cada uno, multiplicando lo que trae por zona sin
    # pedirle más páginas al sitio (pero sí más requests seguidos en la
    # misma sesión, que es justo donde vimos gatillarse Cloudflare).
    property_slug: departamentos   # departamentos | casas | ph
    operation_slug: venta          # venta | alquiler | alquiler-temporario
    # Subido de 4 a 8: con 4 segundos Cloudflare cortaba las tres zonas en la
    # primera o segunda página y traíamos un tercio de lo permitido.
    rate_limit_seconds: 8.0
    # El robots.txt del sitio solo permite indexar hasta la página 5
    # (Allow puntual para pagina-2..5.html, Disallow general de ahí en más).
    # Es un tope duro: aunque pongas más, el código lo recorta a 5.
    max_pages: 5
    # Pasada extra sobre la misma búsqueda, reordenada. De todos los órdenes
    # que ofrece el sitio, el robots.txt habilita uno solo
    # (`Allow: *-orden-precio-ascendente.html`, `Disallow: *-orden-*`) y es
    # el que más nos sirve: son los más baratos de la zona, que es donde
    # miramos. Se pide solo la primera página de ese orden.
    # Cuesta un request más por zona en el portal que ya corta por
    # Cloudflare: si empiezan a aparecer más cortes, vaciá la lista.
    extra_orders:
      - "-orden-precio-ascendente"
    # Sitemap de listados, declarado en el robots.txt del sitio. Hay que
    # pedirlo con el navegador: por HTTP directo Cloudflare responde 403.
    # Armando la URL a mano hay una búsqueda por zona; el sitemap ofrece 325
    # para las diez, entre sub-barrios (bajo-palermo, botanico-palermo,
    # barrio-parque-palermo), ambientes y atributos (-con-balcon,
    # -con-apto-credito). Se descartan las que el robots.txt prohíbe aunque
    # el sitemap las liste. null vuelve a una búsqueda por zona.
    sitemap: "sitemaps_https.xml"
    # Mismo criterio que en Argenprop: se rota, porque pedir las 47 de
    # Palermo de una sola vez son 235 páginas seguidas y Cloudflare corta
    # mucho antes. Con 6 por corrida, las de Palermo se cubren en 9 días.
    max_searches_per_zone: 6
    # Cloudflare marca la SESION, no la IP: reusando la misma pestaña corta
    # en la 2da navegación y nos quedamos con 1 página de 5; abriendo una
    # limpia por página entran las cinco. Medido en Palermo: 25 avisos -> 111.
    # No se resuelve ni se falsifica el challenge, se evita que se dispare,
    # con el mismo rate limit y el mismo tope de páginas que permite el
    # robots.txt (que autoriza pagina-2 a pagina-5 explícitamente).
    # Cuesta unos 3 s por página en abrir el navegador. Poné false para
    # volver al comportamiento anterior.
    new_session_per_page: true

  argenprop:
    enabled: true
    # Arman la URL como /<property_slug>/<operation_slug>/<zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    rate_limit_seconds: 8.0        # mismo motivo que Zonaprop (misma empresa, mismo anti-bot)
    # Acá el robots.txt solo permite ?pagina-1/2/3 — tope duro también.
    max_pages: 3
    # Sitemap de listados, declarado por el propio robots.txt del sitio.
    # Armando la URL a mano solo se llega a /departamentos/venta/palermo, y
    # con el tope de 3 páginas eso son 60 avisos de los ~10.000 que
    # Argenprop tiene en Palermo. El sitemap muestra que el portal indexa
    # además palermo-chico, -hollywood, -soho, -nuevo y -viejo: cada una es
    # otra búsqueda con sus propias 3 páginas. Medido: 3 de esas rutas dan
    # 145 avisos distintos contra 58.
    #
    # El nombre lleva operación y región: para alquiler o para GBA hay que
    # cambiarlo (mirá la lista en /robots.txt). null lo apaga y se vuelve a
    # una sola búsqueda por zona.
    sitemap: "sitemap-listing-venta-caba"
    # Cuántas de esas búsquedas pedir por corrida. Las 18 de Palermo son 54
    # páginas seguidas y Cloudflare corta mucho antes: probado el 21/09,
    # pasaron 8 y el resto fueron bloqueos. Pedirlas todas de una no trae
    # más datos, trae más bloqueos. Con 6 se rota: la del barrio entero va
    # siempre y las demás se reparten, así que en unos días se recorren
    # todas igual. Con 0 se piden todas de una.
    max_searches_per_zone: 6
    # Mismo criterio que Zonaprop: `Allow: /*?orden-menorprecio` es el único
    # orden habilitado. Acá además `Disallow: /*?*&*` impide combinar el
    # orden con la paginación, así que de esta pasada sale una sola página.
    extra_orders:
      - "orden-menorprecio"
    # Cloudflare marca la SESION, no la IP: reusando la misma pestaña corta
    # en la 2da navegación y nos quedamos con 1 página de 5; abriendo una
    # limpia por página entran las cinco. Medido en Palermo: 20 avisos -> 60.
    # No se resuelve ni se falsifica el challenge, se evita que se dispare,
    # con el mismo rate limit y el mismo tope de páginas que permite el
    # robots.txt (que autoriza pagina-2 a pagina-5 explícitamente).
    # Cuesta unos 3 s por página en abrir el navegador. Poné false para
    # volver al comportamiento anterior.
    new_session_per_page: true

  mudafy:
    enabled: true
    # Arma la URL como /<operation_slug>/<property_slug>/<zone_prefix><zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    zone_prefix: "caba-"           # prefijo de Capital Federal en las URLs de Mudafy
    rate_limit_seconds: 4.0
    # El listado no pagina (~25 avisos por zona) y el robots.txt prohíbe las
    # URLs con query string, pero declara este sitemap con los avisos
    # individuales del sitio, y las fichas sí se pueden pedir. Se leen
    # fichas: las tarjetas del listado solo aportan candidatos. El sitemap
    # cubre ~90% de lo publicado, no todo (medido el 22/09). null lo apaga
    # y quedan solo las tarjetas.
    sitemap: "sitemap_listings.xml"
    # Fichas por corrida: primero las que no conocemos, después refrescar
    # las de nuestras zonas de la más vieja a la más nueva. Con 600 a 4 s
    # son ~40 min, que corren en paralelo con Zonaprop (~80): no alargan la
    # corrida. La primera vez hay ~1.400 fichas nuevas en todo el país, así
    # que completar Mudafy lleva unas tres corridas.
    max_fichas_per_run: 600
    # Dónde se anota el barrio de cada ficha ya leída. El sitemap es
    # nacional y la URL no dice el barrio: sin esto, cada corrida volvería a
    # pedir las ~1.000 fichas de Pilar o Nordelta para descartarlas de nuevo.
    # Por defecto, data/mudafy_fichas_<operación>.json.
    # fichas_cache: "data/mudafy_fichas_venta.json"

  remax:
    enabled: true
    # Arma la URL como <property_slug>-en-<operation_slug>-en-<zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    rate_limit_seconds: 6.0        # cortaba 2 de 3 zonas con 4
    # Sufijo que Remax le pega al barrio para desambiguarlo. Sin esto,
    # "palermo" es un landing residual de 1 aviso y "villa-urquiza" da 0:
    # el sitio no tira 404 con un slug que no reconoce, devuelve otra
    # búsqueda sin avisar. Para buscar fuera de CABA, cambialo o vacialo.
    zone_suffix: "-capital-federal"
    # A diferencia de las otras 3 fuentes, el robots.txt de Remax son cuatro
    # líneas: solo banea a AhrefsBot y `?associate`. No hay tope de páginas
    # ni Crawl-delay, y `?page=N` pagina de verdad (probado hasta la 30: 24
    # avisos distintos cada una, cero repetidos). El tope es nuestro.
    #
    # Avisos por página. Remax reenvía este número a su API tal cual, y el
    # scraper lee el JSON que viene con el HTML en vez de esperar a que
    # Angular dibuje las tarjetas: 100 avisos en 2,6 s contra 24 en 7,8 s.
    # Palermo entero pasó de 62 páginas y 11,9 min a 16 páginas y 2,4 min.
    page_size: 100
    # Tope de seguridad: con page_size 100 son 2500 avisos por zona, muy por
    # encima de los 1456 de Palermo. Las zonas cortan solas cuando la lista
    # vuelve vacía, sin quedar marcadas como incompletas.
    max_pages: 25

# MercadoLibre y Argenprop publican la dirección pero no las coordenadas.
# Después de cada scrape, esas direcciones se convierten en un punto con el
# normalizador del GCBA. Cada dirección se consulta una sola vez y queda
# cacheada, así que el atraso se va limpiando en pocas corridas.
geocoding:
  enabled: true
  max_per_run: 3000        # direcciones nuevas por corrida (las cacheadas no cuentan)
  rate_limit_seconds: 1.0

# Cuántos portales recorrer a la vez. Cada uno mantiene su propio rate
# limit, así que ninguno recibe pedidos más seguido que antes: lo que
# cambia es que el reloj total pasa de ser la suma de los cinco a ser el
# del más lento. Con Zonaprop en ~80 min y el resto sumando ~45, la
# diferencia es de ~125 min a ~80.
#
# Cada hilo levanta su propio Chromium, así que subirlo cuesta memoria.
# Con 1 vuelve a correr todo en fila.
scrape:
  parallel_sources: 3

storage:
  path: "data/listings.db"
  # Los alquileres viven en su propia base, que llena
  # `scrape --config config-alquiler.yaml`. `yields` cruza las dos.
  rentals_path: "data/rentals.db"
  # Cada corrida guarda un snapshot de precio por aviso. Esto es lo que
  # construye el historial que ningún portal te muestra.
  keep_snapshots: true

  # Corridas seguidas sin ver un aviso antes de darlo de baja, en las
  # fuentes que no pueden leer la zona entera (todas menos Remax). Ahí una
  # sola ausencia no prueba nada: el robots.txt nos deja ver 5 páginas de
  # las 575 que tiene Palermo en Zonaprop, y ese orden se mueve solo. Pero
  # siete corridas seguidas sin aparecer ya no son mala suerte del orden.
  # El contador se reinicia apenas el aviso vuelve a verse.
  # Con el cron diario, son siete días. Ponelo en 0 para no dar de baja
  # nunca en esas fuentes.
  max_missed_runs: 7

dedup:
  enabled: true
  # Dos avisos se consideran el mismo inmueble si coinciden en zona,
  # ambientes, y caen dentro de estas tolerancias.
  area_tolerance_m2: 2
  price_tolerance_pct: 5

analysis:
  # Un aviso es "subvaluado" si su precio está este % por debajo del
  # esperado para su zona/tipología.
  undervalued_threshold_pct: 15
  # No calcules estadísticas de una zona con menos comparables que esto.
  min_comparables: 20
  # Avisos publicados hace más de N días = vendedor potencialmente apurado
  # (y se excluyen de la mediana de zona/ambientes, ver zone_stats).
  stale_days: 100
  # Recorte de outliers antes de calcular medianas (percentiles).
  outlier_trim_pct: 5

  # Peso de cada parte del score de oportunidad (0-100). Si a un aviso le
  # falta un dato —hoy 3 de cada 4 no traen coordenadas— esa parte no se
  # cuenta como cero: se reparte entre las demás, así no lo castiga.
  weights:
    discount: 50       # cuánto está por debajo de la mediana de su grupo
    price_drops: 20    # cuánto bajó de precio desde que lo vemos
    stale: 0          # hace cuánto está publicado
    location: 20       # qué tan bien ubicado está (ver abajo)

  # Ubicación, contra los datos de inmobot/lugares.json (subtes, hospitales
  # con guardia y cuarteles de bomberos). Se actualizan con
  # scripts/bajar_lugares.py.
  location:
    # A menos de esto del subte suma, y cuanto más cerca, más. 1000 m son
    # unos 12 minutos caminando.
    subte_m: 1000
    # Un hospital con guardia o un cuartel de bomberos más cerca que esto
    # resta: son las dos fuentes de sirenas a cualquier hora.
    evitar_m: 200

alerts:
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"        # ej. smtp.gmail.com
    smtp_port: 587
    # Los mails van en el .env, no acá: este archivo está en un repo público
    # y una dirección suelta en GitHub termina indexada y llena de spam.
    smtp_user: "env:SMTP_USER"
    smtp_password: "env:SMTP_PASSWORD"  # con Gmail: contraseña de aplicación, no la de tu cuenta.
    # Si no ponés from_addr, se usa smtp_user.
    to_addrs:
      - "env:ALERT_TO"
    # Avisar solo si el aviso supera este score de oportunidad (0-100).
    min_score: 70

# Buscador en lenguaje natural del dashboard ("3 ambientes en Palermo, menos
# de 150 mil"). Opcional: sin esta sección, con enabled: false, o sin el
# paquete `openai` instalado, el dashboard funciona igual y el buscador no
# aparece. El modelo no escribe SQL: devuelve filtros que se validan en
# Python (ver inmobot/buscador.py).
#
# Sirve cualquier proveedor compatible con la API de OpenAI. Cambiar de uno a
# otro es cambiar estas líneas:
#
#   Ollama local (gratis, sin clave; antes: `ollama pull qwen2.5:7b`)
#     base_url: "http://localhost:11434/v1"
#     model: "qwen2.5:7b"
#
#   En la nube (ej. Groq; la clave va en el .env, nunca acá)
#     base_url: "https://api.groq.com/openai/v1"
#     model: "openai/gpt-oss-120b"
#     api_key: "env:NL_SEARCH_API_KEY"
#
# nl_search:
#   enabled: true
#   base_url: "http://localhost:11434/v1"
#   model: "qwen2.5:7b"
#   api_key: "env:NL_SEARCH_API_KEY"   # Ollama la ignora
#   timeout_s: 20                      # un modelo local en CPU puede tardar
#   json_mode: true                    # false si el proveedor rechaza response_format

logging:
  level: INFO

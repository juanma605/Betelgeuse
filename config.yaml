# =============================================================================
# inmobot — configuración
# Todo lo que cambia entre búsquedas (o entre clientes) vive acá.
# =============================================================================

search:
  # Zonas a rastrear. Se usan como texto de búsqueda y para agrupar comparables.
  # Podés poner barrios, partidos o ciudades.
  zones:
    - "Palermo"
    - "Belgrano"
    - "Recoleta"
  # Moneda en la que querés comparar. Los avisos en otra moneda se convierten
  # usando fx_rates (abajo) o se descartan si no hay cotización.
  currency: USD

  price_min: 50000
  price_max: 140000

  # Filtros sobre atributos del aviso. Dejá en null lo que no quieras filtrar.
  filters:
    covered_area_min: 40        # m² cubiertos
    covered_area_max: null
    total_area_min: null
    rooms_min: null            # ambientes
    rooms_max: null 
    bedrooms_min: null
    max_maintenance_fee: null   # expensas, en moneda local
    max_age_years: null         # antigüedad
    require_photos: true

  # Cotizaciones para normalizar a `currency`. Actualizalas a mano o
  # enchufá una API después (ver README).
  fx_rates:
    ARS_per_USD: 1500

sources:
  mercadolibre:
    # Apagada: la búsqueda pública de ML quedó atrás de un gate de
    # "certification_status: not_certified" a nivel de la app — no es un
    # tema de token (probamos con uno válido y sigue dando 403 PolicyAgent),
    # y conseguir la certificación no es viable ahora. Queda todo el código
    # y el config listos por si en algún momento se resuelve del otro lado.
    enabled: false
    site: MLA                   # MLA=Argentina, MLU=Uruguay, MLC=Chile...
    # ML dejó de modelar tipo de propiedad + operación como filtros de
    # atributo (OPERATION/PROPERTY_TYPE ya no existen) y ahora los maneja
    # como categoría anidada. Para cambiar de búsqueda, poné acá la
    # categoría hoja que corresponda (verificado 2026-09 contra
    # /categories/<id>, endpoint público que no requiere token):
    #   Departamentos MLA1472 -> Alquiler MLA1473 | Alq.temp MLA50279 | Venta MLA1474
    #   Casas         MLA1466 -> Alquiler MLA1467 | Alq.temp MLA50278 | Venta MLA1468
    #   PH            MLA105179 -> Alquiler MLA105181 | Alq.temp MLA105180 | Venta MLA105182
    category: MLA1474           # Departamentos en venta
    max_results_per_zone: 1000  # tope duro de la API (offset máx 1000)
    page_size: 50
    rate_limit_seconds: 0.4
    # ML cerró la búsqueda pública: hace falta un access_token vigente.
    # Con `oauth` (client_id + client_secret de tu app) se pide uno nuevo
    # por client_credentials en cada corrida — no vence, no hay que
    # loguearse nunca ni guardar nada. `access_token` de abajo es solo el
    # fallback manual si no completás `oauth`.
    # oauth:
    #  client_id: "env:ML_CLIENT_ID"
    #  client_secret: "env:ML_CLIENT_SECRET"
    access_token: "env:ML_ACCESS_TOKEN"

  zonaprop:
    enabled: true
    # Arman la URL como <property_slug>-<operation_slug>-<zona>.html
    # Podés poner un solo tipo o una lista (ej. [departamentos, casas, ph])
    # — la fuente recorre cada uno, multiplicando lo que trae por zona sin
    # pedirle más páginas al sitio (pero sí más requests seguidos en la
    # misma sesión, que es justo donde vimos gatillarse Cloudflare).
    property_slug: departamentos   # departamentos | casas | ph
    operation_slug: venta          # venta | alquiler | alquiler-temporario
    rate_limit_seconds: 4.0
    # El robots.txt del sitio solo permite indexar hasta la página 5
    # (Allow puntual para pagina-2..5.html, Disallow general de ahí en más).
    # Es un tope duro: aunque pongas más, el código lo recorta a 5.
    max_pages: 5

  argenprop:
    enabled: true
    # Arman la URL como /<property_slug>/<operation_slug>/<zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    rate_limit_seconds: 4.0
    # Acá el robots.txt solo permite ?pagina-1/2/3 — tope duro también.
    max_pages: 3

  mudafy:
    enabled: true
    # Arma la URL como /<operation_slug>/<property_slug>/<zone_prefix><zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    zone_prefix: "caba-"           # prefijo de Capital Federal en las URLs de Mudafy
    rate_limit_seconds: 4.0
    # Mudafy no tiene paginación crawleable (mapa + lista de una sola carga,
    # sin botón "más" ni links de página) y su robots.txt prohíbe cualquier
    # URL con query string. Tope real: ~25 avisos por zona por corrida.

  remax:
    enabled: true
    # Arma la URL como <property_slug>-en-<operation_slug>-en-<zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    rate_limit_seconds: 4.0
    # A diferencia de las otras 3 fuentes, el robots.txt de Remax es muy
    # permisivo (solo banea a AhrefsBot y `?associate`) y sí soporta
    # paginación real vía `?page=N` — no hay tope duro del sitio, esto es
    # solo un límite propio para no pasarnos en una sola corrida.
    max_pages: 3

storage:
  path: "data/listings.db"
  # Cada corrida guarda un snapshot de precio por aviso. Esto es lo que
  # construye el historial que ningún portal te muestra.
  keep_snapshots: true

dedup:
  enabled: true
  # Dos avisos se consideran el mismo inmueble si coinciden en zona,
  # ambientes, y caen dentro de estas tolerancias.
  area_tolerance_m2: 2
  price_tolerance_pct: 5

analysis:
  # Un aviso es "subvaluado" si su precio está este % por debajo del
  # esperado para su zona/tipología.
  undervalued_threshold_pct: 15
  # No calcules estadísticas de una zona con menos comparables que esto.
  min_comparables: 20
  # Avisos publicados hace más de N días = vendedor potencialmente apurado
  # (y se excluyen de la mediana de zona/ambientes, ver zone_stats).
  stale_days: 100
  # Recorte de outliers antes de calcular medianas (percentiles).
  outlier_trim_pct: 5

alerts:
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"        # ej. smtp.gmail.com
    smtp_port: 587
    smtp_user: "juanmartinsantamarina@gmail.com"
    smtp_password: "env:SMTP_PASSWORD"  # con Gmail: contraseña de aplicación, no la de tu cuenta. Va en .env, nunca acá.
    from_addr: "juanmartinsantamarina@gmail.com"
    to_addrs:
      - "juanmartinsantamarina@gmail.com"
    # Avisar solo si el aviso supera este score de oportunidad (0-100).
    min_score: 70

logging:
  level: INFO

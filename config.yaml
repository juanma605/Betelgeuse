# =============================================================================
# inmobot — configuración
# Todo lo que cambia entre búsquedas (o entre clientes) vive acá.
# =============================================================================

search:
  # Zonas a rastrear. Se usan como texto de búsqueda y para agrupar comparables.
  # Podés poner barrios, partidos o ciudades.
  zones:
    - "Palermo"
    - "Belgrano"
    - "Recoleta"
    - "Almagro"
    - "Caballito"
    - "Villa Urquiza"
    - "Colegiales"
    - "Villa Crespo"
  # Moneda en la que querés comparar. Los avisos en otra moneda se convierten
  # usando fx_rates (abajo) o se descartan si no hay cotización.
  currency: USD

  price_min: 10000
  price_max: 600000

  # Superficie máxima creíble para lo que buscás. Por encima es un error de
  # carga del portal (hubo un 1½ ambiente con "33420 m²"): se borra ese dato,
  # pero el aviso se guarda igual. No es un filtro: el aviso no se descarta.
  max_plausible_area_m2: 1000

  # Filtros sobre atributos del aviso. Dejá en null lo que no quieras filtrar.
  filters:
    covered_area_min: 10        # m² cubiertos
    covered_area_max: null
    total_area_min: null
    rooms_min: null            # ambientes
    rooms_max: null 
    bedrooms_min: null
    max_maintenance_fee: null   # expensas, en moneda local
    max_age_years: null         # antigüedad
    require_photos: true

  # Cotizaciones para normalizar a `currency`. Actualizalas a mano o
  # enchufá una API después (ver README).
  fx_rates:
    ARS_per_USD: 1500

sources:
  mercadolibre:
    # Se lee el sitio público, no la API: la API cerró la búsqueda a apps no
    # certificadas y la certificación no es alcanzable para este proyecto.
    # Arma la URL como
    #   /<property_slug>/<operation_slug>/<listing_slug>/<region_slug>/<zona>/
    enabled: true
    property_slug: departamentos          # departamentos | casas | ph
    operation_slug: venta                 # venta | alquiler
    # Sin este filtro la primera página son casi todos emprendimientos (ML
    # los ordena arriba). Dejalo vacío ("") para no filtrar.
    listing_slug: propiedades-individuales
    region_slug: capital-federal
    # El robots.txt prohíbe paginar (_Desde_): una página (~48 avisos) por
    # zona. Una sola request por zona, espaciadas.
    rate_limit_seconds: 8.0

  zonaprop:
    enabled: true
    # Arman la URL como <property_slug>-<operation_slug>-<zona>.html
    # Podés poner un solo tipo o una lista (ej. [departamentos, casas, ph])
    # — la fuente recorre cada uno, multiplicando lo que trae por zona sin
    # pedirle más páginas al sitio (pero sí más requests seguidos en la
    # misma sesión, que es justo donde vimos gatillarse Cloudflare).
    property_slug: departamentos   # departamentos | casas | ph
    operation_slug: venta          # venta | alquiler | alquiler-temporario
    # Subido de 4 a 8: con 4 segundos Cloudflare cortaba las tres zonas en la
    # primera o segunda página y traíamos un tercio de lo permitido.
    rate_limit_seconds: 8.0
    # El robots.txt del sitio solo permite indexar hasta la página 5
    # (Allow puntual para pagina-2..5.html, Disallow general de ahí en más).
    # Es un tope duro: aunque pongas más, el código lo recorta a 5.
    max_pages: 5

  argenprop:
    enabled: true
    # Arman la URL como /<property_slug>/<operation_slug>/<zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    rate_limit_seconds: 8.0        # mismo motivo que Zonaprop (misma empresa, mismo anti-bot)
    # Acá el robots.txt solo permite ?pagina-1/2/3 — tope duro también.
    max_pages: 3

  mudafy:
    enabled: true
    # Arma la URL como /<operation_slug>/<property_slug>/<zone_prefix><zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    zone_prefix: "caba-"           # prefijo de Capital Federal en las URLs de Mudafy
    rate_limit_seconds: 4.0
    # Mudafy no tiene paginación crawleable (mapa + lista de una sola carga,
    # sin botón "más" ni links de página) y su robots.txt prohíbe cualquier
    # URL con query string. Tope real: ~25 avisos por zona por corrida.

  remax:
    enabled: true
    # Arma la URL como <property_slug>-en-<operation_slug>-en-<zona>
    property_slug: departamentos   # departamentos | casas | ph (o una lista)
    operation_slug: venta          # venta | alquiler
    rate_limit_seconds: 6.0        # cortaba 2 de 3 zonas con 4
    # A diferencia de las otras 3 fuentes, el robots.txt de Remax es muy
    # permisivo (solo banea a AhrefsBot y `?associate`) y sí soporta
    # paginación real vía `?page=N` — no hay tope duro del sitio, esto es
    # solo un límite propio para no pasarnos en una sola corrida.
    max_pages: 3

# MercadoLibre y Argenprop publican la dirección pero no las coordenadas.
# Después de cada scrape, esas direcciones se convierten en un punto con el
# normalizador del GCBA. Cada dirección se consulta una sola vez y queda
# cacheada, así que el atraso se va limpiando en pocas corridas.
geocoding:
  enabled: true
  max_per_run: 300        # direcciones nuevas por corrida (las cacheadas no cuentan)
  rate_limit_seconds: 1.0

storage:
  path: "data/listings.db"
  # Cada corrida guarda un snapshot de precio por aviso. Esto es lo que
  # construye el historial que ningún portal te muestra.
  keep_snapshots: true

dedup:
  enabled: true
  # Dos avisos se consideran el mismo inmueble si coinciden en zona,
  # ambientes, y caen dentro de estas tolerancias.
  area_tolerance_m2: 2
  price_tolerance_pct: 5

analysis:
  # Un aviso es "subvaluado" si su precio está este % por debajo del
  # esperado para su zona/tipología.
  undervalued_threshold_pct: 15
  # No calcules estadísticas de una zona con menos comparables que esto.
  min_comparables: 20
  # Avisos publicados hace más de N días = vendedor potencialmente apurado
  # (y se excluyen de la mediana de zona/ambientes, ver zone_stats).
  stale_days: 100
  # Recorte de outliers antes de calcular medianas (percentiles).
  outlier_trim_pct: 5

  # Peso de cada parte del score de oportunidad (0-100). Si a un aviso le
  # falta un dato —hoy 3 de cada 4 no traen coordenadas— esa parte no se
  # cuenta como cero: se reparte entre las demás, así no lo castiga.
  weights:
    discount: 50       # cuánto está por debajo de la mediana de su grupo
    price_drops: 20    # cuánto bajó de precio desde que lo vemos
    stale: 0          # hace cuánto está publicado
    location: 20       # qué tan bien ubicado está (ver abajo)

  # Ubicación, contra los datos de inmobot/lugares.json (subtes, hospitales
  # con guardia y cuarteles de bomberos). Se actualizan con
  # scripts/bajar_lugares.py.
  location:
    # A menos de esto del subte suma, y cuanto más cerca, más. 1000 m son
    # unos 12 minutos caminando.
    subte_m: 1000
    # Un hospital con guardia o un cuartel de bomberos más cerca que esto
    # resta: son las dos fuentes de sirenas a cualquier hora.
    evitar_m: 200

alerts:
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"        # ej. smtp.gmail.com
    smtp_port: 587
    # Los mails van en el .env, no acá: este archivo está en un repo público
    # y una dirección suelta en GitHub termina indexada y llena de spam.
    smtp_user: "env:SMTP_USER"
    smtp_password: "env:SMTP_PASSWORD"  # con Gmail: contraseña de aplicación, no la de tu cuenta.
    # Si no ponés from_addr, se usa smtp_user.
    to_addrs:
      - "env:ALERT_TO"
    # Avisar solo si el aviso supera este score de oportunidad (0-100).
    min_score: 70

logging:
  level: INFO
